name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tagged: ${{ steps.version.outputs.tagged }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 50
      - name: Check version and tag
        id: version
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "releases must be dispatched from main" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like 0.20.1" >&2
            exit 1
          fi
          CHANGELOG_VERSION="$(sed -n 's/^## \([0-9][0-9.]*\)$/\1/p' CHANGELOG.md | head -1)"
          if [[ "$VERSION" != "$CHANGELOG_VERSION" ]]; then
            echo "version must match the latest CHANGELOG entry: $CHANGELOG_VERSION" >&2
            exit 1
          fi
          NOTES="$(sed -n "/^## ${VERSION//./\\.}\$/,/^## /p" CHANGELOG.md | sed '1d;/^## /d')"
          if [[ -z "${NOTES//[[:space:]]/}" ]]; then
            echo "the CHANGELOG entry for $VERSION is empty" >&2
            exit 1
          fi
          TAGGED="$(.github/tag-commit.sh "$TAG")"
          if [[ -n "$TAGGED" && "$TAGGED" != "$GITHUB_SHA" ]]; then
            echo "$TAG already names commit $TAGGED, not $GITHUB_SHA." >&2
            echo "If $VERSION is not on Maven Central yet, re-run the release run that tagged $TAGGED," >&2
            echo "or delete the tag and dispatch again; if it is on Central, release the next version instead." >&2
            exit 1
          fi
          echo "tagged=$TAGGED" >> "$GITHUB_OUTPUT"
          {
            echo "notes<<CHANGELOG_ENTRY_END"
            echo "$NOTES"
            echo "CHANGELOG_ENTRY_END"
          } >> "$GITHUB_OUTPUT"
      - name: Require passing tests for this code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UNTESTED_PATHS: '^\.github/(loc-history(-light|-dark)?\.svg|loc_history\.json)$'
        run: |
          TESTED=""
          for SHA in $(git rev-list --first-parent --max-count=50 "$GITHUB_SHA"); do
            PASSED="$(gh run list --workflow tests.yml --commit "$SHA" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
            if [[ "$PASSED" != "0" ]]; then
              TESTED="$SHA"
              break
            fi
          done
          if [[ -z "$TESTED" ]]; then
            echo "tests.yml has not passed on $GITHUB_SHA or its recent ancestors: wait for it, then dispatch again" >&2
            exit 1
          fi
          CHANGED="$(git diff --name-only "$TESTED" "$GITHUB_SHA" | grep -Ev "$UNTESTED_PATHS" || true)"
          if [[ -n "$CHANGED" ]]; then
            echo "tests.yml passed on $TESTED, but these changed since and were not tested:" >&2
            echo "$CHANGED" >&2
            exit 1
          fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          github-token: ""
      - name: Build the signed publication locally
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: make publish-check

  tag:
    needs: check
    if: needs.check.outputs.tagged == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null; then
            exit 0
          fi
          TAGGED="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          if [[ "$TAGGED" != "$GITHUB_SHA" ]]; then
            echo "could not tag $GITHUB_SHA: $TAG names '$TAGGED'" >&2
            exit 1
          fi

  publish:
    needs: [check, tag]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.tag.result != 'failure' && needs.tag.result != 'cancelled' }}
    runs-on: ubuntu-latest
    env:
      POM_URL: https://repo1.maven.org/maven2/fm/apakabar/syllabreak-kotlin/${{ inputs.version }}/syllabreak-kotlin-${{ inputs.version }}.pom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Confirm the tag names this commit
        run: |
          TAGGED="$(.github/tag-commit.sh "$TAG")"
          if [[ "$TAGGED" != "$GITHUB_SHA" ]]; then
            echo "$TAG names '$TAGGED', not $GITHUB_SHA" >&2
            exit 1
          fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          github-token: ""
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          STATUS="$(curl --silent --head --output /dev/null --write-out '%{http_code}' "$POM_URL")"
          if [[ "$STATUS" == "200" ]]; then
            echo "$VERSION is already on Maven Central"
            exit 0
          fi
          if [[ "$STATUS" != "404" ]]; then
            echo "repo1 answered $STATUS for $POM_URL, cannot tell whether $VERSION is published" >&2
            exit 1
          fi
          if ! make publish; then
            echo "if Central reports $VERSION as a duplicate, the earlier upload has not reached repo1 yet: re-run in half an hour" >&2
            exit 1
          fi

  release:
    needs: [check, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released"
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "$NOTES"
